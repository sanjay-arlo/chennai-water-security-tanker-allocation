name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, math, datetime, os
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          root = Path(".")
          def write_csv(name, headers, rows):
              p = root / name
              if p.exists():
                  return
              with p.open("w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(headers); w.writerows(rows)
          zones=["North","Central","South","West","East"]
          districts=["Ariyalur","Chengalpattu","Chennai","Coimbatore","Cuddalore","Dharmapuri","Dindigul","Erode","Kallakurichi","Kancheepuram","Karur","Krishnagiri","Madurai","Mayiladuthurai","Nagapattinam","Namakkal","Nilgiris","Perambalur","Pudukkottai","Ramanathapuram","Ranipet","Salem","Sivaganga","Tenkasi","Thanjavur","Theni","Thoothukudi","Tiruchirappalli","Tirunelveli","Tirupathur","Tiruppur","Tiruvallur","Tiruvarur","Vellore","Viluppuram","Virudhunagar","Kanyakumari","Tiruvannamalai"]
          if repo=="chennai-flood-risk-drainage-gap-analysis":
              h=["ward","zone","flood_incidents","claimed_swd_completion_pct","resident_reported_completion_pct","elevation_m","flood_watch_flag","monsoon_budget_inr","risk_priority_score"]; rows=[]
              for i in range(1,201):
                  z=zones[(i-1)%5]; c=62+(i*7)%33; gap=5+(i*3)%9; rep=max(35,c-gap); inc=4+(i*11)%31; el=round(2.1+(i*5)%70/10,1); fw="Yes" if i%7==0 or (el<4 and inc>20) else "No"; bud=2500000+((i*137)%18)*250000; score=inc*2+(14 if fw=="Yes" else 0)+(100-c)+gap*1.5; rows.append([f"W{i:03d}",z,inc,c,rep,el,fw,bud,round(score,1)])
              write_csv("sample_ward_drainage_flood_data_chennai.csv",h,rows)
          elif repo=="chennai-dengue-early-warning-resource-allocation":
              h=["week","ward","zone","dengue_cases","four_week_baseline_proxy","breeding_sources_removed","screening_camps","trend_ratio","risk_tier"]; rows=[]; start=datetime.date(2026,1,5)
              for i in range(180):
                  w=(start+datetime.timedelta(weeks=i//5)).isoformat(); z=zones[i%5]; ward=f"{z[:2].upper()}-{i%36+1:02d}"; base=12+(i*5)%22; cases=max(2,int(base*(.75+((i*7)%17)/20)))
                  if i%17==0: cases=int(cases*1.8)
                  ratio=cases/base; tier="High" if ratio>=1.35 or cases>=34 else ("Medium" if ratio>=1.05 or cases>=24 else "Low"); rows.append([w,ward,z,cases,base,15+(i*9)%40,2+(i*3)%7,round(ratio,2),tier])
              write_csv("sample_ward_dengue_surveillance_chennai.csv",h,rows)
          elif repo=="chennai-metro-ridership-gap-analysis":
              h=["quarter","station","corridor","dpr_projected_daily_ridership","actual_daily_ridership","actual_vs_projected_pct","last_mile_score","fare_sensitivity_score","common_mobility_card_share"]; rows=[]; corrs=["Phase I","Phase I Extension","Phase II"]; qs=["2025-Q1","2025-Q2","2025-Q3","2025-Q4"]
              for i in range(164):
                  q=qs[i%4]; c=corrs[i%3]; st=f"{c.replace(' ','')[:6]}-{i%41+1:02d}"; p=11000+(i%41)*420+(0 if c=="Phase I" else 1800 if c=="Phase I Extension" else 3200); a=round(p*(.48+((i*7)%35)/100)); rows.append([q,st,c,p,a,round(a/p*100,1),45+(i*11)%51,30+(i*13)%71,22+(i*5)%65])
              write_csv("sample_station_ridership_chennai.csv",h,rows)
          elif repo=="chennai-industrial-air-quality-health-risk":
              h=["date","zone","aqi","pm25_ugm3","pm10_ugm3","population"]; rows=[]; start=datetime.date(2026,1,1); az=["Manali","Ennore","Kodungaiyur","Central","South"]
              for i in range(900):
                  dt=(start+datetime.timedelta(days=i//5)).isoformat(); z=az[i%5]; a=70+(i%5)*12+(i*7)%42; pm=35+(i%5)*8+(i*11)%25; pm10=70+(i%5)*12+(i*13)%45; pop=[130000,105000,90000,520000,410000][i%5]; rows.append([dt,z,a,pm,pm10,pop])
              write_csv("sample_zone_air_quality_chennai.csv",h,rows)
          elif repo=="tamil-nadu-power-demand-grid-resilience":
              h=["date","region","peak_demand_mw","available_capacity_mw","outage_incidents","field_staff_vacancy_rate"]; rows=[]; start=datetime.date(2026,1,1)
              for i in range(365):
                  dt=(start+datetime.timedelta(days=i)).isoformat(); r=zones[i%5]; season=60*math.sin(2*math.pi*i/365); peak=4200+[0,500,300,250,150][i%5]+season+(i*17)%260; cap=4700+[300,100,500,350,450][i%5]+(i*7)%150; rows.append([dt,r,round(peak,1),round(cap,1),2+(i*11)%12,18+(i*13)%29])
              write_csv("sample_tn_power_demand_outage_data.csv",h,rows)
          elif repo=="tiruppur-textile-tariff-shock-diversification":
              h=["month","market","product_category","us_tariff_pct","order_value_inr","order_units_index","export_margin_pct"]; rows=[]; months=[f"2025-{m:02d}" for m in range(1,13)]+[f"2026-{m:02d}" for m in range(1,7)]; markets=["US","EU","UK","Middle East","Other"]; products=["Knitwear","Sportswear","Innerwear","Kidswear","Home Textiles"]
              for i in range(150):
                  mo=months[i%18]; mk=markets[i%5]; pc=products[i%5]; tariff=8 if mk!="US" else 18+(i*3)%25; val=450000+(i*7919)%1750000; mar=round(8+(i*7)%13-(max(0,tariff-18)*.18 if mk=="US" else 0),1); rows.append([mo,mk,pc,round(tariff,1),val,70+(i*17)%70,mar])
              write_csv("sample_tiruppur_export_orders.csv",h,rows)
          elif repo=="tamil-nadu-womens-dbt-scheme-impact":
              h=["district","estimated_eligible_population","enrolled_beneficiaries","coverage_pct","rejected_applications","appeals","annual_cost_current_inr","annual_cost_proposed_inr"]; rows=[]
              for i,d in enumerate(districts):
                  e=18000+(i*431)%52000; b=round(e*(76+(i*7)%20)/100); rows.append([d,e,b,round(b/e*100,1),120+(i*13)%580,20+(i*11)%210,b*1000*12,b*2500*12])
              write_csv("sample_kmut_district_coverage.csv",h,rows)
          elif repo=="tamil-nadu-investment-job-creation-tracker":
              h=["mou_id","sector","district","announced_investment_inr","realisation_pct","realised_investment_inr","jobs_promised","jobs_verified","days_to_realisation"]; rows=[]; sectors=["Electronics","Automotive","Renewables","Textiles","Logistics","IT/ITES","Food Processing","Pharma"]
              for i in range(1,98):
                  sec=sectors[(i-1)%8]; d=districts[(i*3)%len(districts)]; ann=50000000+(i*7919)%950000000; real=18+(i*11)%79; realised=round(ann*real/100); jobs=100+(i*137)%4900; ver=round(jobs*(.28+((i*7)%63)/100)); rows.append([f"MOU-{i:04d}",sec,d,ann,real,realised,jobs,ver,120+(i*47)%880])
              write_csv("sample_tn_investment_mou_tracker.csv",h,rows)
          elif repo=="india-upi-fraud-mule-account-risk":
              h=["case_id","fraud_pattern","account_channel","loss_amount_inr","hours_to_report","new_payee_flag","device_change_flag","urgency_language_flag","unusual_amount_flag","mule_flag","risk_score","amount_recovered_inr"]; rows=[]; pats=["Account Takeover","Fake Merchant","Investment Scam","Remote Access","Phishing","Mule Account","Social Engineering"]; chans=["UPI","QR","Collect","AutoPay"]
              for i in range(1,301):
                  pat=pats[(i-1)%7]; ch=chans[(i*3)%4]; loss=1000+(i*24791)%240000; hrs=1+(i*13)%96; np=int(i%4==0 or i%9==0); dc=int(i%7==0); urg=int(i%3==0); ua=int(i%5 in (0,1)); mule=int(pat=="Mule Account" or i%17==0); risk=round(min(99,25+np*15+dc*15+urg*10+ua*12+mule*20+min(20,loss/15000)),1); rec=round(loss*(.05+((i*5)%55)/100)) if hrs<24 else round(loss*(.02+((i*3)%20)/100)); rows.append([f"UPI-{i:05d}",pat,ch,loss,hrs,np,dc,urg,ua,mule,risk,rec])
              write_csv("sample_upi_fraud_signals_india.csv",h,rows)
          PY

      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          csv=$(find . -maxdepth 1 -type f -name '*.csv' | head -n 1 || true)
          if [ -z "${csv}" ]; then echo 'No project CSV found after generation' >&2; exit 1; fi
          cp "${csv}" dashboard/data.csv
          cat > dashboard/README.txt <<'EOF'
This dashboard is generated from the project repository CSV by the GitHub Actions build pipeline.
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard *.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
